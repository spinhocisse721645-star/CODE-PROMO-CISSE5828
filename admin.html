<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - CISSE PRONOS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .box {
      background: #151c24;
      border: 1px solid #293542;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      font-size: 17px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 1px solid #364453;
      border-radius: 10px;
      background: #0b0f14;
      color: white;
      font-size: 16px;
    }

    select {
      appearance: auto;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #e6e6e6;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #702020;
      color: white;
    }

    .edit {
      background: #304b68;
      color: white;
    }

    .delete {
      background: #702020;
      color: white;
    }

    .cancel {
      background: #555;
      color: white;
    }

    .prediction {
      border: 1px solid #364453;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      background: #111820;
    }

    .teams {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .message {
      padding: 13px;
      margin-top: 15px;
      border-radius: 9px;
      background: #202b36;
      line-height: 1.4;
    }

    .hidden {
      display: none;
    }

    #adminPanel {
      display: none;
    }

    .small {
      color: #9ca8b5;
      font-size: 13px;
    }

    .status {
      font-weight: bold;
    }

    .status-pending {
      color: #ffd166;
    }

    .status-won {
      color: #50fa7b;
    }

    .status-lost {
      color: #ff5555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 CISSE PRONOS</h1>


  <!-- =========================
       CONNEXION
  ========================== -->

  <div id="loginBox" class="box">

    <h2>Connexion</h2>

    <p class="small">
      Connecte-toi avec ton compte Supabase.
    </p>

    <label>📧 Email</label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="Ton adresse email">


    <label>🔑 Mot de passe</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Ton mot de passe">


    <button onclick="login()">
      🔐 Se connecter
    </button>

    <div id="loginMessage"></div>

  </div>



  <!-- =========================
       ADMIN
  ========================== -->

  <div id="adminPanel">


    <!-- =========================
         FORMULAIRE
    ========================== -->

    <div class="box">

      <h2 id="formTitle">
        ➕ Ajouter un pronostic
      </h2>

      <input
        type="hidden"
        id="editId">


      <!-- EQUIPE 1 -->

      <label>⚽ Équipe 1</label>

      <input
        id="equipe1"
        type="text"
        placeholder="Ex : Arsenal">


      <!-- EQUIPE 2 -->

      <label>⚽ Équipe 2</label>

      <input
        id="equipe2"
        type="text"
        placeholder="Ex : Chelsea">


      <!-- TYPE DE PARI -->

      <label>🎯 Type de pari</label>

      <select id="pari">

        <option value="">
          -- Choisir un pari --
        </option>

        <option value="Victoire équipe 1">
          🏆 Victoire équipe 1
        </option>

        <option value="Victoire équipe 2">
          🏆 Victoire équipe 2
        </option>

        <option value="Match nul">
          🤝 Match nul
        </option>

        <option value="Plus de 2 buts">
          ⚽ Plus de 2 buts
        </option>

        <option value="3 buts ou plus">
          ⚽ 3 buts ou plus
        </option>

        <option value="Moins de 2 buts">
          ⚽ Moins de 2 buts
        </option>

        <option value="Nombre de corners">
          🚩 Nombre de corners
        </option>

        <option value="Nombre de fautes">
          🟨 Nombre de fautes
        </option>

        <option value="Cartons jaunes">
          🟨 Cartons jaunes
        </option>

        <option value="Carton rouge">
          🟥 Carton rouge
        </option>

        <option value="Les deux équipes marquent">
          🎯 Les deux équipes marquent
        </option>

        <option value="Autre pari">
          ✏️ Autre pari
        </option>

      </select>


      <!-- PRECISION DU PARI -->

      <label>🎯 Précision du pari</label>

      <input
        id="precision"
        type="text"
        placeholder="Ex : Plus de 8.5 corners">


      <!-- COTE -->

      <label>💰 Cote</label>

      <input
        id="cote"
        type="number"
        step="0.01"
        min="1"
        placeholder="Ex : 1.85">


      <!-- ANALYSE -->

      <label>📝 Analyse</label>

      <textarea
        id="description"
        rows="5"
        placeholder="Écris ton analyse du match..."></textarea>


      <!-- DATE -->

      <label>📅 Date et heure du match</label>

      <input
        id="date_match"
        type="datetime-local">


      <!-- STATUT -->

      <label>📌 Statut</label>

      <select id="statut">

        <option value="Pending">
          ⏳ Pending
        </option>

        <option value="Won">
          ✅ Won
        </option>

        <option value="Lost">
          ❌ Lost
        </option>

      </select>


      <!-- BOUTON -->

      <button
        id="saveButton"
        onclick="savePronostic()">

        ➕ Publier le pronostic

      </button>


      <button
        id="cancelButton"
        class="cancel hidden"
        onclick="cancelEdit()">

        ❌ Annuler la modification

      </button>


      <div id="formMessage"></div>

    </div>



    <!-- =========================
         LISTE DES PRONOSTICS
    ========================== -->

    <div class="box">

      <h2>
        📋 Mes pronostics
      </h2>

      <div id="list">
        Chargement...
      </div>

    </div>



    <!-- =========================
         DECONNEXION
    ========================== -->

    <div class="box">

      <button
        class="logout"
        onclick="logout()">

        🚪 Se déconnecter

      </button>

    </div>

  </div>

</div>



<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
  "https://avonpsmoruevwlokkfjg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_X-ymjcUkkgIBLFR8WL55DQ_uR8WnqfR";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================================
   UTILITAIRE : ID UNIQUE
========================================================== */

function generateId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {

    return window.crypto.randomUUID();

  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).substring(2)
  );

}


/* ==========================================================
   SECURITE HTML
========================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==========================================================
   DATE
========================================================== */

function formatDate(value) {

  if (!value) {

    return "Date non indiquée";

  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {

    return String(value);

  }

  return date.toLocaleString(
    "fr-FR",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );

}


/* ==========================================================
   MESSAGE
========================================================== */

function setMessage(
  elementId,
  text
) {

  document.getElementById(
    elementId
  ).innerHTML =
    `<div class="message">
      ${escapeHtml(text)}
    </div>`;

}


/* ==========================================================
   AFFICHAGE LOGIN
========================================================== */

function showLogin() {

  document.getElementById(
    "loginBox"
  ).style.display = "block";

  document.getElementById(
    "adminPanel"
  ).style.display = "none";

}


/* ==========================================================
   AFFICHAGE ADMIN
========================================================== */

function showAdmin() {

  document.getElementById(
    "loginBox"
  ).style.display = "none";

  document.getElementById(
    "adminPanel"
  ).style.display = "block";

  loadPronostics();

}


/* ==========================================================
   SESSION
========================================================== */

async function checkSession() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    console.error(error);

    showLogin();

    return;

  }


  if (data.session) {

    showAdmin();

  } else {

    showLogin();

  }

}


/* ==========================================================
   CONNEXION
========================================================== */

async function login() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  if (!email || !password) {

    setMessage(
      "loginMessage",
      "⚠️ Entre ton email et ton mot de passe."
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email: email,

        password: password

      });


  if (error) {

    console.error(error);

    setMessage(
      "loginMessage",
      "❌ Connexion impossible : " +
      error.message
    );

    return;

  }


  document.getElementById(
    "password"
  ).value = "";


  document.getElementById(
    "loginMessage"
  ).innerHTML = "";


  showAdmin();

}


/* ==========================================================
   DECONNEXION
========================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  cancelEdit();

  showLogin();

}


/* ==========================================================
   UTILISATEUR CONNECTE
========================================================== */

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(error);

    return null;

  }


  return data.user;

}


/* ==========================================================
   ENREGISTRER PRONOSTIC
========================================================== */

async function savePronostic() {

  const user =
    await getCurrentUser();


  if (!user) {

    showLogin();

    return;

  }


  const equipe1 =
    document.getElementById(
      "equipe1"
    ).value.trim();


  const equipe2 =
    document.getElementById(
      "equipe2"
    ).value.trim();


  const pari =
    document.getElementById(
      "pari"
    ).value;


  const precision =
    document.getElementById(
      "precision"
    ).value.trim();


  const cote =
    document.getElementById(
      "cote"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const dateInput =
    document.getElementById(
      "date_match"
    ).value;


  const statut =
    document.getElementById(
      "statut"
    ).value;


  const editId =
    document.getElementById(
      "editId"
    ).value;


  /* ==========================
     VERIFICATION
  ========================== */

  if (
    !equipe1 ||
    !equipe2 ||
    !pari ||
    !cote ||
    !dateInput
  ) {

    setMessage(
      "formMessage",
      "⚠️ Remplis tous les champs obligatoires."
    );

    return;

  }


  const coteNumber =
    Number(cote);


  if (
    !Number.isFinite(coteNumber) ||
    coteNumber <= 0
  ) {

    setMessage(
      "formMessage",
      "⚠️ La cote doit être un nombre valide."
    );

    return;

  }


  /* ==========================
     DATE
  ========================== */

  const dateMatch =
    dateInput.replace(
      "T",
      " "
    ) + ":00";


  let result;


  /* ========================================================
     MODIFICATION
  ======================================================== */

  if (editId) {

    result =
      await supabaseClient
        .from("pronostics")
        .update({

          equipe1:
            equipe1,

          equipe2:
            equipe2,

          pari:
            pari,

          cote:
            coteNumber,

          description:
            description,

          date_match:
            dateMatch,

          statut:
            statut

        })
        .eq(
          "id",
          editId
        )
        .eq(
          "user_id",
          user.id
        );

  }


  /* ========================================================
     NOUVEAU PRONOSTIC
  ======================================================== */

  else {

    /*
      IMPORTANT :
      Ta colonne "id" est obligatoire.
      On génère donc un ID automatiquement.
    */

    const newId =
      generateId();


    /*
      On ajoute la précision au texte du pari
      pour ne pas avoir besoin d'une nouvelle
      colonne dans Supabase.
    */

    let pariFinal =
      pari;


    if (precision) {

      pariFinal =
        pari +
        " — " +
        precision;

    }


    result =
      await supabaseClient
        .from("pronostics")
        .insert({

          id:
            newId,

          equipe1:
            equipe1,

          equipe2:
            equipe2,

          pari:
            pariFinal,

          cote:
            coteNumber,

          description:
            description,

          date_match:
            dateMatch,

          statut:
            statut,

          user_id:
            user.id

        });

  }


  /* ========================================================
     ERREUR
  ======================================================== */

  if (result.error) {

    console.error(
      result.error
    );

    setMessage(
      "formMessage",
      "❌ Erreur Supabase : " +
      result.error.message
    );

    return;

  }


  /* ========================================================
     SUCCES
  ======================================================== */

  if (editId) {

    setMessage(
      "formMessage",
      "✅ Pronostic modifié avec succès."
    );

  } else {

    setMessage(
      "formMessage",
      "✅ Pronostic publié avec succès."
    );

  }


  cancelEdit();

  await loadPronostics();

}


/* ==========================================================
   CHARGER LES PRONOSTICS
========================================================== */

async function loadPronostics() {

  const list =
    document.getElementById(
      "list"
    );


  const user =
    await getCurrentUser();


  if (!user) {

    showLogin();

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("pronostics")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .order(
        "date_match",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="message">
        ❌ ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML =
      `<div class="message">
        📋 Aucun pronostic publié pour le moment.
      </div>`;

    return;

  }


  list.innerHTML = "";


  data.forEach(
    p => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "prediction";


      let statusText =
        "⏳ En attente";

      let statusClass =
        "status-pending";


      if (
        p.statut === "Won"
      ) {

        statusText =
          "✅ Gagné";

        statusClass =
          "status-won";

      }


      if (
        p.statut === "Lost"
      ) {

        statusText =
          "❌ Perdu";

        statusClass =
          "status-lost";

      }


      item.innerHTML = `

        <div class="teams">
          ${escapeHtml(p.equipe1)}
          🆚
          ${escapeHtml(p.equipe2)}
        </div>

        <p>
          🎯 <strong>Pari :</strong>
          ${escapeHtml(p.pari)}
        </p>

        <p>
          💰 <strong>Cote :</strong>
          ${escapeHtml(p.cote)}
        </p>

        <p>
          📅 <strong>Match :</strong>
          ${escapeHtml(
            formatDate(p.date_match)
          )}
        </p>

        <p>
          📝 <strong>Analyse :</strong><br>
          ${escapeHtml(
            p.description ||
            "Aucune analyse"
          )}
        </p>

        <p class="status ${statusClass}">
          📌 <strong>Statut :</strong>
          ${statusText}
        </p>

        <button
          class="edit"
          onclick="editPronostic(${JSON.stringify(p.id)})">

          ✏️ Modifier

        </button>

        <button
          class="delete"
          onclick="deletePronostic(${JSON.stringify(p.id)})">

          🗑️ Supprimer

        </button>

      `;


      list.appendChild(
        item
      );

    }
  );

}


/* ==========================================================
   MODIFIER
========================================================== */

async function editPronostic(id) {

  const user =
    await getCurrentUser();


  if (!user) {

    showLogin();

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("pronostics")
      .select("*")
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        user.id
      )
      .single();


  if (
    error ||
    !data
  ) {

    alert(
      "❌ Impossible de récupérer ce pronostic."
    );

    return;

  }


  document.getElementById(
    "editId"
  ).value =
    data.id;


  document.getElementById(
    "equipe1"
  ).value =
    data.equipe1 || "";


  document.getElementById(
    "equipe2"
  ).value =
    data.equipe2 || "";


  /*
    Comme le pari peut maintenant contenir
    une précision, on affiche le texte complet
    dans le champ select seulement si une option
    correspond.
  */

  const pariSelect =
    document.getElementById(
      "pari"
    );


  const pariValue =
    data.pari || "";


  let found =
    false;


  for (
    const option of pariSelect.options
  ) {

    if (
      option.value ===
      pariValue
    ) {

      pariSelect.value =
        option.value;

      found = true;

      break;

    }

  }


  if (!found) {

    pariSelect.value =
      "Autre pari";

  }


  document.getElementById(
    "precision"
  ).value = "";


  document.getElementById(
    "cote"
  ).value =
    data.cote || "";


  document.getElementById(
    "description"
  ).value =
    data.description || "";


  document.getElementById(
    "statut"
  ).value =
    data.statut ||
    "Pending";


  /* ==========================
     DATE
  ========================== */

  if (
    data.date_match
  ) {

    const d =
      new Date(
        data.date_match
      );


    if (
      !isNaN(
        d.getTime()
      )
    ) {

      const year =
        d.getFullYear();


      const month =
        String(
          d.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          d.getDate()
        ).padStart(
          2,
          "0"
        );


      const hours =
        String(
          d.getHours()
        ).padStart(
          2,
          "0"
        );


      const minutes =
        String(
          d.getMinutes()
        ).padStart(
          2,
          "0"
        );


      document.getElementById(
        "date_match"
      ).value =
        `${year}-${month}-${day}T${hours}:${minutes}`;

    }

  }


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Modifier le pronostic";


  document.getElementById(
    "saveButton"
  ).textContent =
    "💾 Enregistrer les modifications";


  document.getElementById(
    "cancelButton"
  ).classList.remove(
    "hidden"
  );


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* ==========================================================
   ANNULER MODIFICATION
========================================================== */

function cancelEdit() {

  document.getElementById(
    "editId"
  ).value = "";


  document.getElementById(
    "equipe1"
  ).value = "";


  document.getElementById(
    "equipe2"
  ).value = "";


  document.getElementById(
    "pari"
  ).value = "";


  document.getElementById(
    "precision"
  ).value = "";


  document.getElementById(
    "cote"
  ).value = "";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "date_match"
  ).value = "";


  document.getElementById(
    "statut"
  ).value =
    "Pending";


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Ajouter un pronostic";


  document.getElementById(
    "saveButton"
  ).textContent =
    "➕ Publier le pronostic";


  document.getElementById(
    "cancelButton"
  ).classList.add(
    "hidden"
  );

}


/* ==========================================================
   SUPPRIMER
========================================================== */

async function deletePronostic(id) {

  const confirmation =
    confirm(
      "⚠️ Veux-tu vraiment supprimer ce pronostic ?"
    );


  if (!confirmation) {

    return;

  }


  const user =
    await getCurrentUser();


  if (!user) {

    showLogin();

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("pronostics")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        user.id
      );


  if (error) {

    console.error(error);

    alert(
      "❌ Erreur : " +
      error.message
    );

    return;

  }


  alert(
    "✅ Pronostic supprimé."
  );


  await loadPronostics();

}


/* ==========================================================
   AUTHENTIFICATION
========================================================== */

supabaseClient.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    if (session) {

      showAdmin();

    } else {

      showLogin();

    }

  }
);


/* ==========================================================
   DEMARRAGE
========================================================== */

checkSession();

</script>

</body>
  </html>
